# =========================================================================
#  VensuR - Frontend (Vite) en Netlify
#  El backend vive en Render. Netlify reenvía /api/* y /uploads/* al backend
#  para que el frontend use rutas relativas (sin CORS ni URLs absolutas).
# =========================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  # Timeout de las peticiones a la API (ms). Amplio para tolerar el "cold start"
  # del plan gratuito de Render (el primer request tras inactividad tarda ~40 s).
  VITE_API_TIMEOUT_MS = "45000"
  # DEJAR VACÍO: el frontend llama a rutas relativas y Netlify las reenvía a Render.
  VITE_API_BASE_URL = ""

# ---- Reenvío al backend en Render -------------------------------------------
# ⚠️  EDITA la URL: reemplaza TU-SERVICIO-EN-RENDER por el nombre real de tu
#     Web Service de Render (queda como https://<algo>.onrender.com).

[[redirects]]
  from = "/api/*"
  to = "https://TU-SERVICIO-EN-RENDER.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://TU-SERVICIO-EN-RENDER.onrender.com/uploads/:splat"
  status = 200
  force = true

# ---- SPA: cualquier otra ruta sirve index.html -----------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---- Cabeceras -------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
