# =========================================================================
#  VensuR - Frontend (Vite) en Netlify
#  El backend vive en Render. NO edites este archivo: en el panel de Netlify
#  define la variable  API_PROXY_TARGET = https://<tu-servicio>.onrender.com
#  y el build genera dist/_redirects para reenviar /api/* y /uploads/* allí.
# =========================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  # Timeout de las peticiones a la API (ms). Amplio para tolerar el "cold start"
  # del plan gratuito de Render (el primer request tras inactividad tarda ~40 s).
  VITE_API_TIMEOUT_MS = "45000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
